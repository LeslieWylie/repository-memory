[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "repository-memory"
version = "0.5.0"
description = "Standalone citation-first repository memory Skill, CLI, MCP server, and local L0-L3 runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Repository Memory contributors" }]
dependencies = []

[project.scripts]
repository-memory = "repository_memory:cli"

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
]
semantic = [
  "sentence-transformers>=3,<6",
  "torch>=2.2",
  "transformers>=4.40",
]

[tool.pytest.ini_options]
testpaths = ["skills/repository-memory/tests"]

[tool.setuptools]
package-dir = {"" = "skills/repository-memory/scripts"}
py-modules = [
  "adapters",
  "audit_proxy",
  "autocapture",
  "citation",
  "core",
  "discovery",
  "doctor",
  "eval_gate",
  "evaluate",
  "fallback",
  "index",
  "install",
  "knowledge",
  "knowledge_service",
  "local_index",
  "local_embedding",
  "local_memory",
  "memmy",
  "standalone_memory",
  "mcp_server",
  "memorycore",
  "memorycore_service",
  "models",
  "repository_memory",
  "snapshot",
  "semantic_repository",
  "team_memory",
  "team_memory_eval",
  "vendor_components",
  "version",
]
